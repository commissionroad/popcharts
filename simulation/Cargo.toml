[package]
name = "popcharts-simulation"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"

[lints.clippy]
all = "deny"
pedantic = "deny"

[lints.rust]
unsafe_code = "forbid"

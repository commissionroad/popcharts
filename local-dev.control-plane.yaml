version: "0.5"

log_level: info
log_location: .local-dev/logs/all.log
log_configuration:
  rotation:
    max_size_mb: 10
    max_backups: 3

# Restart policy for the long-running services below.
#
# `always`, not `on_failure`. A failed readiness probe makes process-compose
# terminate its process with SIGTERM, and every service pane runs through the
# `inherit` helper in scripts/local-dev-control.ts, which reports a
# signal-terminated child as exit 0. So a probe-killed service is
# indistinguishable from a clean stop, and `on_failure` declines to restart
# it. That is the 2026-07-14 failure exactly: a hung review service was killed
# by its probe, and the stack ran on degraded, in silence.
#
# `always` is safe for teardown because process-compose suppresses restarts
# once project shutdown begins — Ctrl-C and `local:stack stop` both tear the
# stack down without a restart loop. Nothing below exits 0 on purpose; they
# are all daemons.
#
# `max_restarts` bounds a genuinely broken service: it parks after ten
# attempts with a visible restart count, rather than looping forever.
#
# `chain` is deliberately excluded — the devchain keeps its state in memory,
# and deploy-contracts does not re-run, so a restarted chain would come back
# empty and contractless. That is worse than a stopped one, because it looks
# healthy.

processes:
  prepare-database:
    description: Start local Postgres, apply local constraints, and push the schema.
    command: "node --experimental-strip-types scripts/local-dev-control.ts prepare-database"
    working_dir: "."
    availability:
      restart: "exit_on_failure"
    log_location: .local-dev/logs/prepare-database.log

  database-log:
    description: Follow the local Postgres container logs without owning its data volume.
    command: "node --experimental-strip-types scripts/local-dev-control.ts database-log"
    working_dir: "."
    depends_on:
      prepare-database:
        condition: process_completed_successfully
    success_exit_codes: [130, 143]
    log_location: .local-dev/logs/database.log

  chain:
    description: Start or attach to the local Hardhat JSON-RPC chain.
    command: "node --experimental-strip-types scripts/local-dev-control.ts chain"
    working_dir: "."
    depends_on:
      prepare-database:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: "node --experimental-strip-types scripts/local-dev-control.ts rpc-ready"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 45
    success_exit_codes: [130, 143]
    log_location: .local-dev/logs/chain.log

  deploy-contracts:
    description: Deploy local protocol contracts and write generated app/server env.
    command: "node --experimental-strip-types scripts/local-dev-control.ts deploy-contracts"
    working_dir: "."
    depends_on:
      chain:
        condition: process_healthy
    availability:
      restart: "exit_on_failure"
    log_location: .local-dev/logs/deploy-contracts.log

  review-service:
    description: Run the local market review service in heuristic mode by default.
    command: "node --experimental-strip-types scripts/local-dev-control.ts review-service"
    working_dir: "."
    depends_on:
      prepare-database:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: "node --experimental-strip-types scripts/local-dev-control.ts review-ready"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 30
    success_exit_codes: [130, 143]
    availability:
      restart: "always"
      backoff_seconds: 5
      max_restarts: 10
    log_location: .local-dev/logs/review-service.log


  resolution-service:
    description: Run the local market resolution service in heuristic mode by default.
    command: "node --experimental-strip-types scripts/local-dev-control.ts resolution-service"
    working_dir: "."
    depends_on:
      prepare-database:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: "node --experimental-strip-types scripts/local-dev-control.ts resolution-ready"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 30
    success_exit_codes: [130, 143]
    availability:
      restart: "always"
      backoff_seconds: 5
      max_restarts: 10
    log_location: .local-dev/logs/resolution-service.log

  resolution-runner:
    description: Poll Postgres for graduated markets past their resolution gate.
    command: "node --experimental-strip-types scripts/local-dev-control.ts resolution-runner"
    working_dir: "."
    depends_on:
      prepare-database:
        condition: process_completed_successfully
      resolution-service:
        condition: process_healthy
    success_exit_codes: [130, 143]
    availability:
      restart: "always"
      backoff_seconds: 5
      max_restarts: 10
    log_location: .local-dev/logs/resolution-runner.log

  api:
    description: Run the Bun API with generated local chain configuration.
    command: "node --experimental-strip-types scripts/local-dev-control.ts api"
    working_dir: "."
    depends_on:
      deploy-contracts:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: "node --experimental-strip-types scripts/local-dev-control.ts api-ready"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 30
    success_exit_codes: [130, 143]
    availability:
      restart: "always"
      backoff_seconds: 5
      max_restarts: 10
    log_location: .local-dev/logs/api.log

  indexer:
    description: Run the chain event indexer after the API and generated env are ready.
    command: "node --experimental-strip-types scripts/local-dev-control.ts indexer"
    working_dir: "."
    depends_on:
      api:
        condition: process_healthy
    readiness_probe:
      exec:
        command: "node --experimental-strip-types scripts/local-dev-control.ts indexer-ready"
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 45
    success_exit_codes: [130, 143]
    availability:
      restart: "always"
      backoff_seconds: 5
      max_restarts: 10
    log_location: .local-dev/logs/indexer.log

  keeper:
    description: Run the venue keeper that arbs graduated-market pools and drains deferred maker fills.
    command: "node --experimental-strip-types scripts/local-dev-control.ts keeper"
    working_dir: "."
    depends_on:
      indexer:
        condition: process_healthy
    success_exit_codes: [130, 143]
    availability:
      restart: "always"
      backoff_seconds: 5
      max_restarts: 10
    log_location: .local-dev/logs/keeper.log

  app:
    description: Run the Next.js app against the generated local chain/API env.
    command: "node --experimental-strip-types scripts/local-dev-control.ts app"
    working_dir: "."
    depends_on:
      indexer:
        condition: process_healthy
    readiness_probe:
      exec:
        command: "node --experimental-strip-types scripts/local-dev-control.ts app-ready"
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 60
    success_exit_codes: [130, 143]
    availability:
      restart: "always"
      backoff_seconds: 5
      max_restarts: 10
    log_location: .local-dev/logs/app.log

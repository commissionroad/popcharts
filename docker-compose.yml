services:
  postgres:
    image: postgres:16-alpine
    container_name: popcharts-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: popcharts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the Unix socket: the entrypoint's temporary initdb server
      # is socket-only, so a socket probe reports healthy before the real
      # server exists. See waitForPostgresServer in
      # scripts/shared/docker/ensureLocalPostgres.ts.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
